# Migrated by ADO2GHA from the Azure DevOps build pipeline "AKS-Self-Hosted-Agent-Docker container-CI" (definition 2).
# Resolve every review blocker and validate a representative run before enabling triggers.
name: AKS-Self-Hosted-Agent-Docker container-CI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: Agent job 1
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Login to Azure Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: newcontainerregistry01.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}
          file: Dockerfile
          push: 'false'
          tags: ${{ github.event.repository.name }}:${{ github.run_number }}
      - name: Login to Azure Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: newcontainerregistry01.azurecr.io
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}
      - name: Push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ github.workspace }}
          file: Dockerfile
          push: 'true'
          tags: ${{ github.event.repository.name }}:${{ github.run_number }}
